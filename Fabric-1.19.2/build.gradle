plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'Block_ID-fabric'
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// 拼音库 (Fabric 使用 include 直接打包进主 Jar)
	// Apache-2.0 许可，用于替代 GPL 系的 pinyin4j 以消除协议冲突
	// ahocorasick 仅用于自定义词典分词，本场景不使用，排除以减小 Jar 体积
	implementation('io.github.biezhi:TinyPinyin:2.0.3.RELEASE') {
		exclude group: 'org.ahocorasick', module: 'ahocorasick'
	}
	include('io.github.biezhi:TinyPinyin:2.0.3.RELEASE') {
		exclude group: 'org.ahocorasick', module: 'ahocorasick'
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// 注意：没有 withSourcesJar()，所以不会生成 sources 包

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}