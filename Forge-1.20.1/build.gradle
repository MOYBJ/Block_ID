plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '2.1.1-Beta'
group = 'com.moybj'
archivesBaseName = 'Block_ID-forge' // 修改为区分版本

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                blockid {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                blockid {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    // 拼音库：Apache-2.0 许可，用于替代 GPL 系的 pinyin4j 以消除协议冲突
    // ahocorasick 仅用于自定义词典分词，本场景不使用，排除以减小 Jar 体积
    minecraftLibrary('io.github.biezhi:TinyPinyin:2.0.3.RELEASE') {
        exclude group: 'org.ahocorasick', module: 'ahocorasick'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1',
            forge_version: '47.4.10',
            mod_id: 'block_id',
            mod_name: 'Block_ID (Forge)',
            mod_author: 'MOYBJ'
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": "block_id",
                "Specification-Vendor": "MOYBJ",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": "MOYBJ"
        ])
    }

    // 将 pinyin4j 打包进主 Jar，使其成为全量包
    from {
        configurations.minecraftLibrary.collect { it.isDirectory() ? it : zipTree(it) }
    }

    // 排除可能损坏的数字签名文件
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// 彻底禁用 jarJar 任务，防止生成带有 -all 后缀的额外文件
tasks.named('jarJar').configure {
    enabled = false
}